<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15), transparent 50%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav { display: flex; gap: 10px; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 10px;
        }
        nav a:hover, nav a.active { color: #fff; background: rgba(255, 255, 255, 0.08); }

        .lang-select {
            background: #1e293b;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .hero {
            max-width: 900px;
            margin: auto;
            text-align: center;
            padding: 60px 20px;
        }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--text-muted); font-size: 1.2rem; margin-bottom: 50px; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="/" class="active" data-key="nav-home">Home</a>
            <a href="/youtube">YouTube</a>
            <a href="/facebook">Facebook</a>
            <a href="/instagram">Instagram</a>
            <a href="/tiktok">TikTok</a>
        </nav>
        <select class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en" selected>English</option>
            <option value="ku">کوردی</option>
            <option value="ar">العربية</option>
        </select>
    </header>

    <div class="hero">
        <h1 data-key="hero-title">Download High Quality Videos</h1>
        <p data-key="hero-desc">Select your preferred platform to start downloading videos effortlessly.</p>

        <div class="cards-grid">
            <a href="/youtube" class="card"><span>YouTube</span></a>
            <a href="/facebook" class="card"><span>Facebook</span></a>
            <a href="/instagram" class="card"><span>Instagram</span></a>
            <a href="/tiktok" class="card"><span>TikTok</span></a>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                "nav-home": "Home",
                "hero-title": "Download High Quality Videos",
                "hero-desc": "Select your preferred platform to start downloading videos effortlessly."
            },
            ku: {
                "nav-home": "سەرەکی",
                "hero-title": "داگرتنی ڤیدیۆ بە کوالێتی بەرز",
                "hero-desc": "پلاتفۆڕمی دڵخوازت هەڵبژێرە بۆ داگرتنی ڤیدیۆکان بە ئاسانی."
            },
            ar: {
                "nav-home": "الرئيسية",
                "hero-title": "تحميل فيديوهات بجودة عالية",
                "hero-desc": "اختر المنصة المفضلة لديك للبدء في تحميل الفيديوهات بكل سهولة."
            }
        };

        function changeLanguage(lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            
            document.querySelectorAll('[data-key]').forEach(elem => {
                const key = elem.getAttribute('data-key');
                if (translations[lang][key]) {
                    elem.innerText = translations[lang][key];
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15), transparent 50%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav { display: flex; gap: 10px; flex-wrap: wrap; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 10px;
        }
        nav a:hover, nav a.active { color: #fff; background: rgba(255, 255, 255, 0.08); }

        .lang-select {
            background: #1e293b;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .hero {
            max-width: 900px;
            margin: auto;
            text-align: center;
            padding: 60px 20px;
            width: 100%;
        }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--text-muted); font-size: 1.2rem; margin-bottom: 50px; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
        }

        /* بەشی گونجاندن لەگەڵ مۆبایل و تابلێت */
        @media (max-width: 600px) {
            header {
                padding: 12px 4%;
                flex-direction: column;
                gap: 12px;
            }
            nav {
                justify-content: center;
                gap: 6px;
            }
            nav a {
                padding: 6px 10px;
                font-size: 0.85rem;
            }
            .hero {
                padding: 30px 15px;
            }
            .hero h1 {
                font-size: 1.8rem;
                margin-bottom: 12px;
            }
            .hero p {
                font-size: 0.95rem;
                margin-bottom: 30px;
            }
            .cards-grid {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                gap: 12px;
            }
            .card {
                padding: 20px 10px;
                font-size: 1rem;
            }
        }
        .f2ter {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .fv {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="/" class="active" data-i18n="nav_home">Home</a>
            <a href="/youtube" data-i18n="nav_youtube">YouTube</a>
            <a href="/facebook" data-i18n="nav_facebook">Facebook</a>
            <a href="/instagram" data-i18n="nav_instagram">Instagram</a>
            <a href="/tiktok" data-i18n="nav_tiktok">TikTok</a>
        </nav>
        <select id="language-select" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="ku">کوردی</option>
            <option value="ar">العربية</option>
        </select>
    </header>

    <div class="hero">
        <h1 data-i18n="hero_title">Download High Quality Videos</h1>
        <p data-i18n="hero_desc">Select your preferred platform to start downloading videos effortlessly.</p>

        <div class="cards-grid">
            <a href="/youtube" class="card"><span data-i18n="nav_youtube">YouTube</span></a>
            <a href="/facebook" class="card"><span data-i18n="nav_facebook">Facebook</span></a>
            <a href="/instagram" class="card"><span data-i18n="nav_instagram">Instagram</span></a>
            <a href="/tiktok" class="card"><span data-i18n="nav_tiktok">TikTok</span></a>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                "nav_home": "Home",
                "nav_youtube": "YouTube",
                "nav_facebook": "Facebook",
                "nav_instagram": "Instagram",
                "nav_tiktok": "TikTok",
                "hero_title": "Download High Quality Videos",
                "hero_desc": "Select your preferred platform to start downloading videos effortlessly."
            },
            ku: {
                "nav_home": "سەرەکی",
                "nav_youtube": "یووتیووب",
                "nav_facebook": "فەیسبووک",
                "nav_instagram": "ئینستاگرام",
                "nav_tiktok": "تیکتۆک",
                "hero_title": "داگرتنی ڤیدیۆ بە کوالێتی بەرز",
                "hero_desc": "پلاتفۆڕمی دڵخوازت هەڵبژێرە بۆ داگرتنی ڤیدیۆکان بە ئاسانی."
            },
            ar: {
                "nav_home": "الرئيسية",
                "nav_youtube": "يوتيوب",
                "nav_facebook": "فيسبوك",
                "nav_instagram": "إنستغرام",
                "nav_tiktok": "تيك توك",
                "hero_title": "تحميل فيديوهات بجودة عالية",
                "hero_desc": "اختر المنصة المفضلة لديك للبدء في تحميل الفيديوهات بكل سهولة."
            }
        };

        function changeLanguage(lang) {
            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    elem.innerText = translations[lang][key];
                }
            });
            
            const selectElem = document.getElementById('language-select');
            if (selectElem) selectElem.value = lang;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('app_lang') || 'en';
            changeLanguage(savedLang);
        });
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <footer class="f2ter">
        © 2026 Professional Web Video Downloader<br>Powered by A. Coder<a href="https://shorturl.at/wrmY1" class="fv"> FV-Downloader</a>
    </footer>
</body>
</html>

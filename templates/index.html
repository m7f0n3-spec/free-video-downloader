<head>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15), transparent 50%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- بەشی پێشەکی گڵۆپ --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #05070d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease, transform 0.8s ease;
        }

        #neon-flash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(99,102,241,0.8) 0%, rgba(165,180,252,0) 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 10000;
            transition: opacity 0.2s ease;
        }

        .bulb-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .bulb-container {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bulb-svg {
            width: 110px;
            height: 110px;
            fill: #334155;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.1));
            transition: transform 0.3s ease, fill 0.5s ease, filter 0.5s ease;
            animation: pulseBulb 2s infinite ease-in-out;
        }

        .bulb-container:hover .bulb-svg {
            transform: scale(1.08);
            fill: #475569;
        }

        .pull-chain {
            width: 4px;
            height: 60px;
            background: linear-gradient(to bottom, #475569, #94a3b8);
            position: relative;
            margin-top: -10px;
            border-radius: 2px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .pull-chain::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: -6px;
            width: 16px;
            height: 16px;
            background: #cbd5e1;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .pull-chain.pulled {
            transform: translateY(18px);
        }

        .bulb-container.on .bulb-svg {
            fill: #fbbf24;
            filter: drop-shadow(0 0 35px #fbbf24) drop-shadow(0 0 70px #f59e0b);
            animation: none;
        }

        @keyframes pulseBulb {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .bulb-text {
            margin-top: 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-size: 1.2rem;
            color: var(--text-muted);
            min-height: 35px;
            text-align: center;
            padding: 0 15px;
        }

        .fade-out-up {
            opacity: 0 !important;
            visibility: hidden !important;
            transform: translateY(-100vh);
        }

        /* --- ناوەڕۆک --- */
        .main-content {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content.visible {
            opacity: 1;
            transform: translateY(0);
        }

        header {
            width: 100%;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap; /* ڕێگەدان بە بەستەرەکان بۆ دابەزین بۆ ڕیزی نوێ */
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: background 0.2s ease, color 0.2s ease, transform 0.1s ease;
            white-space: nowrap;
        }

        nav a svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        nav a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        nav a.active {
            color: #fff;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        nav a:active {
            transform: scale(0.96);
        }

        .lang-select {
            background: #1e293b;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            font-size: 0.85rem;
        }

        .hero {
            max-width: 900px;
            margin: auto;
            text-align: center;
            padding: 50px 20px;
            width: 100%;
        }
        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 40px; }

        /* --- کارتەکان --- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 28px 20px;
            border-radius: 18px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(40px) rotateX(-20deg);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card svg {
            width: 40px;
            height: 40px;
            transition: transform 0.3s ease, fill 0.3s ease;
        }

        .main-content.visible .card {
            opacity: 1;
            transform: translateY(0) rotateX(0deg);
        }

        .main-content.visible .card:nth-child(1) { transition-delay: 0.1s; }
        .main-content.visible .card:nth-child(2) { transition-delay: 0.25s; }
        .main-content.visible .card:nth-child(3) { transition-delay: 0.4s; }
        .main-content.visible .card:nth-child(4) { transition-delay: 0.55s; }

        .card.yt:hover { border-color: #ff0000; box-shadow: 0 10px 25px -5px rgba(255, 0, 0, 0.4); transform: translateY(-8px) scale(1.03) !important; }
        .card.yt svg { fill: #ff0000; }

        .card.fb:hover { border-color: #1877f2; box-shadow: 0 10px 25px -5px rgba(24, 119, 242, 0.4); transform: translateY(-8px) scale(1.03) !important; }
        .card.fb svg { fill: #1877f2; }

        .card.ig:hover { border-color: #e4405f; box-shadow: 0 10px 25px -5px rgba(228, 64, 95, 0.4); transform: translateY(-8px) scale(1.03) !important; }
        .card.ig svg { fill: #e4405f; }

        .card.tt:hover { border-color: #00f2fe; box-shadow: 0 10px 25px -5px rgba(0, 242, 254, 0.4); transform: translateY(-8px) scale(1.03) !important; }
        .card.tt svg { fill: #00f2fe; }

        .card:hover svg { transform: scale(1.15); }

        /* --- خۆگونجاندنی گشتگیر بۆ مۆبایل --- */
        @media (max-width: 768px) {

                gap: 10px;
            }
            nav {

                justify-content: center;
                order: 2;
                flex-wrap: wrap;
                gap: 6px;
            }
            .lang-select {

            }

            }
            nav a {

                gap: 5px;

            nav a svg {

            .hero p { font-size: 0.95rem; margin-bottom: 25px; }
            .cards-grid {

                gap: 12px;
            }
            .card {

                font-size: 0.9rem;
                border-radius: 14px;
            }
            .card svg {
                width: 32px;
                height: 32px;
            }
        }
        
        @media (max-width: 400px) {
            nav a span { display: inline-block; }
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .f2ter {

            padding: 20px;

            color: var(--text-muted);
        }
        .fv {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    const span = elem.querySelector('span');
                    if (span) {
                        span.innerText = translations[lang][key];
                    } else {
                        elem.innerText = translations[lang][key];
                    }
                }
            });
            
            const selectElem = document.getElementById('language-select');
            if (selectElem) selectElem.value = lang;
        }

        const messages = [
            "Click the bulb or chain to enter...",
            "انقر على المصباح أو السلسلة للدخول...",
            "بۆ چوونه ژوورەوە کلیک لە گڵۆپەکە یان زنجیرەکە بکە..."
        ];
        let msgIdx = 0;
        let charIdx = 0;
        let isDeleting = false;
        const typewriterEl = document.getElementById('typewriter-text');

        function typeLoop() {
            if (!typewriterEl) return;
            const currentMsg = messages[msgIdx];
            if (isDeleting) {
                typewriterEl.innerText = currentMsg.substring(0, charIdx--);
            } else {
                typewriterEl.innerText = currentMsg.substring(0, charIdx++);
            }

            let typeSpeed = isDeleting ? 40 : 80;

            if (!isDeleting && charIdx === currentMsg.length + 1) {
                typeSpeed = 1800;
                isDeleting = true;
            } else if (isDeleting && charIdx === 0) {
                isDeleting = false;
                msgIdx = (msgIdx + 1) % messages.length;
                typeSpeed = 400;
            }

            setTimeout(typeLoop, typeSpeed);
        }

        function playSwitchSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                console.log("Audio play blocked.");
            }
        }

        const bulbBtn = document.getElementById('bulb-btn');
        const pullChain = document.getElementById('pull-chain');
        const introOverlay = document.getElementById('intro-overlay');
        const mainContent = document.getElementById('main-content');
        const neonFlash = document.getElementById('neon-flash');
        let activated = false;

        function activateLight() {
            if (activated) return;
            activated = true;

            sessionStorage.setItem('bulb_turned_on', 'true');

            playSwitchSound();
            pullChain.classList.add('pulled');

            setTimeout(() => {
                bulbBtn.classList.add('on');
                neonFlash.style.opacity = '1';
                setTimeout(() => { neonFlash.style.opacity = '0'; }, 300);
            }, 100);

            setTimeout(() => {
                introOverlay.classList.add('fade-out-up');
                mainContent.classList.add('visible');
            }, 600);
        }

        bulbBtn.addEventListener('click', activateLight);
        pullChain.addEventListener('click', activateLight);

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('app_lang') || 'en';
            changeLanguage(savedLang);

            const navEntries = performance.getEntriesByType('navigation');
            const isReload = navEntries.length > 0 && navEntries[0].type === 'reload';

            if (isReload) {
                sessionStorage.removeItem('bulb_turned_on');
            }

            if (sessionStorage.getItem('bulb_turned_on') === 'true') {
                introOverlay.style.display = 'none';
                mainContent.classList.add('visible');
            } else {
                typeLoop();
            }
        });
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15), transparent 50%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        nav { display: flex; gap: 10px; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 10px;
        }
        nav a:hover, nav a.active { color: #fff; background: rgba(255, 255, 255, 0.08); }

        .lang-select {
            background: #1e293b;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-top: 40px;
            width: 90%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin: 15px 0 15px 0;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            border-radius: 12px;
            outline: none;
            font-size: 1rem;
        }
        input[type="text"]:focus { border-color: var(--primary); }

        .btn-paste {
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-paste:hover { background: rgba(255, 255, 255, 0.2); }

        .options-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        select.quality-select {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-weight: 600;
        }

        button.btn-main {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
        }
        button.btn-main:hover { background-color: var(--primary-hover); }

        .preview-card {
            display: none;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }
        [dir="rtl"] .preview-card { text-align: right; }

        .preview-card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .preview-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 5px; }
        .preview-meta { color: var(--text-muted); font-size: 0.85rem; }

        .progress-bar {
            width: 100%;
            background-color: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .progress {
            width: 0%;
            height: 22px;
            background-color: #10b981;
            text-align: center;
            color: white;
            line-height: 22px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="/" data-key="nav-home">Home</a>
            <a href="/youtube" class="{% if platform == 'YouTube' %}active{% endif %}">YouTube</a>
            <a href="/facebook" class="{% if platform == 'Facebook' %}active{% endif %}">Facebook</a>
            <a href="/instagram" class="{% if platform == 'Instagram' %}active{% endif %}">Instagram</a>
            <a href="/tiktok" class="{% if platform == 'TikTok' %}active{% endif %}">TikTok</a>
        </nav>
        <select class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en" selected>English</option>
            <option value="ku">کوردی</option>
            <option value="ar">العربية</option>
        </select>
    </header>

    <div class="container">
        <h2> Instagram Downloader</h2>
        
        <div class="input-group">
            <input type="text" id="videoUrl" data-key-ph="input-ph" placeholder="Paste video link here..." oninput="checkVideoInfo()">
            <button class="btn-paste" onclick="pasteFromClipboard()" data-key="btn-paste">Paste</button>
        </div>

        <div class="options-group">
            <select id="qualitySelect" class="quality-select">
                <option value="best" data-key="opt-best">Best Quality (Auto)</option>
                <option value="1080p">1080p Full HD</option>
                <option value="720p">720p HD</option>
                <option value="480p">480p SD</option>
                <option value="mp3" data-key="opt-mp3">Audio Only (MP3)</option>
            </select>
        </div>

        <button class="btn-main" onclick="startDownload()" data-key="btn-dl">Download</button>

        <div class="preview-card" id="previewCard">
            <img id="prevImg" src="" alt="Thumbnail">
            <div class="preview-title" id="prevTitle"></div>
            <div class="preview-meta" id="prevMeta"></div>
        </div>

        <div class="progress-bar" id="progressBarContainer">
            <div class="progress" id="progressBar">0%</div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                "nav-home": "Home",
                "input-ph": "Paste video link here...",
                "btn-paste": "Paste",
                "opt-best": "Best Quality (Auto)",
                "opt-mp3": "Audio Only (MP3)",
                "btn-dl": "Download",
                "msg-empty": "Please enter a URL!",
                "msg-fetching": "Fetching video info...",
                "msg-dl": "Downloading...",
                "msg-done": "Completed!",
                "msg-err": "Error occurred during download.",
                "msg-server": "Server Connection Error!"
            },
            ku: {
                "nav-home": "سەرەکی",
                "input-ph": "لینکی ڤیدیۆکە لێرە دابنێ...",
                "btn-paste": "پەیست",
                "opt-best": "باشترین کوالێتی (ئۆتۆ)",
                "opt-mp3": "تەنها دەنگ (MP3)",
                "btn-dl": "داونلۆدکردن",
                "msg-empty": "تکایە لینکێک دابنێ!",
                "msg-fetching": "هێنانی زانیاری ڤیدیۆ...",
                "msg-dl": "داگرتن...",
                "msg-done": "تەواوبوو!",
                "msg-err": "هەڵەیەک ڕوویدا لە کاتی داگرتن.",
                "msg-server": "کێشەی پەیوەندیکردن بە سێرڤەر!"
            },
            ar: {
                "nav-home": "الرئيسية",
                "input-ph": "ألصق رابط الفيديو هنا...",
                "btn-paste": "لصق",
                "opt-best": "أفضل جودة (تلقائي)",
                "opt-mp3": "صوت فقط (MP3)",
                "btn-dl": "تحميل",
                "msg-empty": "الرجاء إدخال الرابط!",
                "msg-fetching": "جلب معلومات الفيديو...",
                "msg-dl": "جاري التحميل...",
                "msg-done": "اكتمل!",
                "msg-err": "حدث خطأ أثناء التحميل.",
                "msg-server": "خطأ في الاتصال بالسيرفر!"
            }
        };

        let currentLang = 'en';

        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            
            document.querySelectorAll('[data-key]').forEach(elem => {
                const key = elem.getAttribute('data-key');
                if (translations[lang][key]) elem.innerText = translations[lang][key];
            });

            document.querySelectorAll('[data-key-ph]').forEach(elem => {
                const key = elem.getAttribute('data-key-ph');
                if (translations[lang][key]) elem.placeholder = translations[lang][key];
            });
        }

        async function pasteFromClipboard() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    document.getElementById('videoUrl').value = text;
                    checkVideoInfo();
                } else {
                    throw new Error("Clipboard API not supported");
                }
            } catch (err) {
                // ئەگەر فایرفۆکس ڕێگەی نەدا، فوکەس دەخاتە سەر ئینپوتەکە بۆ ئەوەی بێ کێشە Ctrl+V بکەیت
                const input = document.getElementById('videoUrl');
                input.focus();
                input.select();
                alert('Please paste the link using Ctrl+V (or Command+V).');
            }
        }

        let typingTimer;
        function checkVideoInfo() {
            clearTimeout(typingTimer);
            const url = document.getElementById('videoUrl').value;
            if (url.length > 10) {
                typingTimer = setTimeout(() => fetchMetadata(url), 600);
            }
        }

        async function fetchMetadata(url) {
            const previewCard = document.getElementById('previewCard');
            try {
                const response = await fetch('/get-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('prevImg').src = data.thumbnail;
                    document.getElementById('prevTitle').innerText = data.title;
                    document.getElementById('prevMeta').innerText = `Duration: ${data.duration} | By: ${data.uploader}`;
                    previewCard.style.display = 'block';
                }
            } catch (e) {
                previewCard.style.display = 'none';
            }
        }

        async function startDownload() {
            const url = document.getElementById('videoUrl').value;
            const format = document.getElementById('qualitySelect').value;
            const progressBarContainer = document.getElementById('progressBarContainer');
            const progressBar = document.getElementById('progressBar');

            if (!url) { alert(translations[currentLang]["msg-empty"]); return; }

            progressBarContainer.style.display = 'block';
            progressBar.style.width = '40%';
            progressBar.innerText = translations[currentLang]["msg-dl"];

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, format: format })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    progressBar.style.width = '100%';
                    progressBar.innerText = translations[currentLang]["msg-done"];

                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = format === 'mp3' ? "audio.mp3" : "video.mp4";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    alert(translations[currentLang]["msg-err"]);
                    progressBarContainer.style.display = 'none';
                }
            } catch (error) {
                alert(translations[currentLang]["msg-server"]);
                progressBarContainer.style.display = 'none';
            }
        }
    </script>
</body>
</html>

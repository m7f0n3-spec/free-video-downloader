<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e1306c;
            --primary-hover: #c13584;
            --primary-glow: rgba(225, 48, 108, 0.4);
            --gradient-ig: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --bg: #0b0f19;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        /* Light Theme Variables */
        [data-theme="light"] {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border: rgba(0, 0, 0, 0.1);
            --text: #0f172a;
            --text-muted: #64748b;
        }

        [data-theme="light"] body {
            background: linear-gradient(-45deg, #f8fafc, #e2e8f0, #cbd5e1, #f8fafc) !important;
        }

        [data-theme="light"] header {
            background: rgba(255, 255, 255, 0.7) !important;
        }

        [data-theme="light"] .container {
            box-shadow: 0 20px 50px rgba(0,0,0,0.1), 0 0 35px rgba(225, 48, 108, 0.1) !important;
        }

        [data-theme="light"] input[type="text"],
        [data-theme="light"] input[type="number"],
        [data-theme="light"] select.quality-select,
        [data-theme="light"] .lang-select,
        [data-theme="light"] .trim-box {
            background: rgba(255, 255, 255, 0.9) !important;
            color: var(--text) !important;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body {
            background: linear-gradient(-45deg, #0b0f19, #2b1055, #751555, #0b0f19);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite !important;
            color: var(--text);
            font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        header {
            width: 100%;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        nav a svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        nav a:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.1);
        }

        nav a:hover svg {
            transform: translateY(-2px) scale(1.15);
        }

        nav a.active {
            color: #ffffff !important;
            background: var(--gradient-ig);
            font-weight: 800;
            box-shadow: 0 0 15px var(--primary-glow), 0 4px 12px rgba(225, 48, 108, 0.4);
        }

        [data-theme="light"] nav a:not(.active) {
            color: #475569;
        }
        [data-theme="light"] nav a:not(.active):hover {
            color: #0f172a;
            background: rgba(0, 0, 0, 0.05);
        }

        nav a.active svg {
            fill: #ffffff !important;
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.8));
        }

        .lang-select {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            font-size: 0.85rem;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 30px 24px;
            border-radius: 24px;
            border: 1px solid var(--border);
            margin-top: 30px;
            width: 90%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 35px rgba(225, 48, 108, 0.15);
            animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        .container:hover {
            border-color: rgba(225, 48, 108, 0.5);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 45px rgba(225, 48, 108, 0.3);
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--gradient-ig);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 3px;
            margin-bottom: 15px;
            width: 100%;
        }

        [data-theme="light"] .input-group {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: none;
            background: transparent;
            color: var(--text);
            outline: none;
            font-size: 0.95rem;
            min-width: 0;
        }

        .btn-paste {
            position: relative;
            padding: 8px 16px;
            background: var(--gradient-ig);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(225, 48, 108, 0.3);
            animation: pulseGlow 3s infinite alternate;
        }

        .btn-paste::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.5) 50%, transparent 70%);
            transform: rotate(30deg);
            animation: shimmerEffect 2.5s infinite;
        }

        .btn-paste:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(225, 48, 108, 0.6);
            filter: brightness(1.15);
        }

        .btn-paste:active { transform: scale(0.95); }

        @keyframes shimmerEffect {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 8px rgba(225, 48, 108, 0.4); }
            100% { box-shadow: 0 0 18px rgba(225, 48, 108, 0.8); }
        }

        .trim-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f472b6;
            text-align: left;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        [dir="rtl"] .trim-title { text-align: right; }

        .trim-box {
            display: flex;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            border: 1px dashed var(--border);
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .trim-box > div { flex: 1; min-width: 120px; }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            border-radius: 10px;
            outline: none;
            font-size: 0.9rem;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .trim-box label { font-size: 0.78rem; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600; }

        .options-group { display: flex; gap: 12px; margin-bottom: 20px; }

        select.quality-select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        button.btn-main {
            width: 100%;
            padding: 14px;
            background: var(--gradient-ig);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 8px 25px -4px var(--primary-glow);
            position: relative;
            overflow: hidden;
        }

        button.btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -2px rgba(225, 48, 108, 0.6);
            filter: brightness(1.1);
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.15) 37%, rgba(255,255,255,0.05) 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
            border-radius: 8px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .skeleton-card {
            display: none;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
        }

        .skeleton-img { width: 100%; height: 200px; margin-bottom: 12px; }
        .skeleton-text { height: 16px; margin-bottom: 8px; width: 80%; }
        .skeleton-text-short { height: 12px; width: 40%; }

        .preview-card {
            display: none;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
            text-align: left;
            animation: fadeIn 0.5s ease forwards;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        [dir="rtl"] .preview-card { text-align: right; }

        .preview-card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
            object-fit: cover;
        }

        .preview-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; color: var(--text); }
        .preview-meta { color: var(--text-muted); font-size: 0.82rem; }
        
        .playlist-badge {
            display: inline-block;
            background: #10b981;
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            overflow: hidden;
            border: 1px solid var(--border);
            padding: 3px;
            direction: ltr;
        }

        .progress {
            width: 0%;
            height: 18px;
            background: linear-gradient(90deg, #e1306c, #10b981);
            border-radius: 6px;
            text-align: center;
            color: white;
            line-height: 18px;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(225, 48, 108, 0.5);
            transition: width 0.3s ease;
        }

        @media (max-width: 640px) {
            header {
                padding: 10px 3%;
                flex-direction: column;
                gap: 10px;
            }
            nav {
                width: 100%;
                justify-content: center;
                gap: 4px;
            }
            nav a {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            .container {
                margin-top: 15px;
                padding: 20px 14px;
                width: 95%;
            }
            .trim-box { flex-direction: column; gap: 8px; }
        }

        .f2ter { text-align: center; margin-top: auto; padding: 20px 0; font-size: 0.8rem; color: var(--text-muted); }
        .fv { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <canvas id="confettiCanvas"></canvas>

    <header>
        <nav>
            <a href="/" data-i18n="nav_home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </a>
            <a href="/youtube" data-i18n="nav_youtube">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>

            </a>
            <a href="/facebook" data-i18n="nav_facebook">
                <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                <span>Facebook</span>
            </a>
            <a href="/instagram" class="active" data-i18n="nav_instagram">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

                <span>TikTok</span>
            </a>
        </nav>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="themeToggle" onclick="toggleTheme()" class="lang-select" style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 0;" title="Toggle Theme">
                <svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M12 3c.49 0 .96.05 1.42.15-3.08.7-5.42 3.39-5.42 6.6 0 3.71 3.01 6.72 6.72 6.72 3.21 0 5.9-2.34 6.6-5.42.1.46.15.93.15 1.42 0 5.25-4.25 9.5-9.5 9.5s-9.5-4.25-9.5-9.5 4.25-9.5 9.5-9.5z"/>
                </svg>
            </button>
            <select id="language-select" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="ku">کوردی</option>
                <option value="ar">العربية</option>
            </select>
        </div>
    </header>

    <div class="container" id="mainContainer">
        <h2 data-i18n="ig_title">Instagram Downloader</h2>
        
        <div class="input-group">
            <input type="text" id="videoUrl" data-i18n-ph="input_ph" placeholder="Paste video link here..." oninput="checkVideoInfo()">
            <button class="btn-paste" onclick="pasteFromClipboard()" data-i18n="btn_paste">Paste</button>
        </div>

        <div class="trim-title" data-i18n="trim_title">Trim Video (Optional) ✂️</div>
        <div class="trim-box">
            <div>
                <label data-i18n="lbl_start">Start Time (Sec)</label>
                <input type="number" id="startTime" placeholder="0" min="0">
            </div>
            <div>
                <label data-i18n="lbl_end">End Time (Sec)</label>
                <input type="number" id="endTime" placeholder="End" min="0">
            </div>
        </div>

        <div class="options-group">
            <select id="qualitySelect" class="quality-select">
                <option value="best" data-i18n="opt_best">Best Quality (Auto)</option>
                <option value="mp3" data-i18n="opt_mp3">Audio Only (MP3)</option>
            </select>
        </div>

        <button class="btn-main" onclick="startDownload()" data-i18n="btn_dl">Download</button>

        <div class="skeleton-card" id="skeletonCard">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text-short"></div>
        </div>

        <div class="preview-card" id="previewCard">
            <img id="prevImg" src="" alt="Thumbnail">
            <div class="preview-title" id="prevTitle"></div>
            <div class="preview-meta" id="prevMeta"></div>
            <div id="playlistBadge" class="playlist-badge" style="display: none;"></div>
        </div>

        <div class="progress-bar" id="progressBarContainer">
            <div class="progress" id="progressBar">0%</div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                "nav_home": "Home",
                "nav_youtube": "YouTube",
                "nav_facebook": "Facebook",
                "nav_instagram": "Instagram",
                "nav_tiktok": "TikTok",
                "ig_title": "Instagram Downloader",
                "input_ph": "Paste video link here...",
                "btn_paste": "Paste",
                "trim_title": "Trim Video (Optional) ✂️",
                "opt_best": "Best Quality (Auto)",
                "opt_mp3": "Audio Only (MP3)",
                "btn_dl": "Download",
                "lbl_start": "Start Time (Sec)",
                "lbl_end": "End Time (Sec)",
                "msg_empty": "Please enter a URL!",
                "msg_done": "Completed!",
                "msg_err": "Error occurred during download.",
                "msg_server": "Server Connection Error!",
                "playlist_info": "Playlist/Carousel Detected ({count} Items) - Will Download as ZIP",
                "prompt_paste": "Please paste the video link here:"
            },
            ku: {
                "nav_home": "سەرەکی",
                "nav_youtube": "یووتیووب",
                "nav_facebook": "فەیسبووک",
                "nav_instagram": "ئینستاگرام",
                "nav_tiktok": "تیکتۆک",
                "ig_title": "داگرتنی ڤیدیۆی ئینستاگرام",

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    const span = elem.querySelector('span');
                    if (span) {
                        span.innerText = translations[lang][key];
                    } else {
                        elem.innerText = translations[lang][key];
                    }
                }
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(elem => {
                const key = elem.getAttribute('data-i18n-ph');
                if (translations[lang] && translations[lang][key]) elem.placeholder = translations[lang][key];
            });

            const selectElem = document.getElementById('language-select');
            if (selectElem) selectElem.value = lang;
        }

            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('app_theme', newTheme);
            updateThemeIcon(newTheme);
        }

        async function pasteFromClipboard() {
            const inputField = document.getElementById('videoUrl');

            if (navigator.clipboard && navigator.clipboard.readText) {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        inputField.value = text;
                        checkVideoInfo();
                        return;
                    }
                } catch (err) {
                    console.warn("Clipboard API failed...");
                }
            }

            const promptMsg = translations[currentLang]["prompt_paste"] || "Please paste the link here:";
            const manualText = prompt(promptMsg);
            if (manualText) {
                inputField.value = manualText.trim();
                checkVideoInfo();
            }
        }

        let typingTimer;
        function checkVideoInfo() {
            clearTimeout(typingTimer);
            const url = document.getElementById('videoUrl').value.trim();
            if (url.length > 10) {
                typingTimer = setTimeout(() => fetchMetadata(url), 600);
            }
        }

        async function fetchMetadata(url) {
            const previewCard = document.getElementById('previewCard');
            const skeletonCard = document.getElementById('skeletonCard');
            const qualitySelect = document.getElementById('qualitySelect');
            const playlistBadge = document.getElementById('playlistBadge');

            previewCard.style.display = 'none';
            skeletonCard.style.display = 'block';

            try {
                const response = await fetch('/get-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('prevImg').src = data.thumbnail || '';
                    document.getElementById('prevTitle').innerText = data.title || 'Instagram Post';
                    document.getElementById('prevMeta').innerText = `Duration: ${data.duration || 'N/A'} | By: ${data.uploader || 'Instagram User'}`;
                    
                    if (data.is_playlist) {
                        const badgeText = translations[currentLang]["playlist_info"].replace('{count}', data.playlist_count || 0);
                        playlistBadge.innerText = badgeText;
                        playlistBadge.style.display = 'inline-block';
                    } else {
                        playlistBadge.style.display = 'none';
                    }

                    qualitySelect.innerHTML = `<option value="best">${translations[currentLang]["opt_best"]}</option>`;
                    if (data.qualities && data.qualities.length > 0) {
                        data.qualities.forEach(q => {
                            const opt = document.createElement('option');
                            opt.value = q.format_id;
                            opt.innerText = q.label;
                            qualitySelect.appendChild(opt);
                        });
                    }
                    qualitySelect.innerHTML += `<option value="mp3">${translations[currentLang]["opt_mp3"]}</option>`;

                    skeletonCard.style.display = 'none';
                    previewCard.style.display = 'block';
                } else {
                    skeletonCard.style.display = 'none';
                }
            } catch (e) {
                skeletonCard.style.display = 'none';
                previewCard.style.display = 'none';
            }
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let pieces = [];
            const numberOfPieces = 100;
            const colors = ['#e1306c', '#f09433', '#e6683c', '#dc2743', '#cc2366', '#bc1888', '#10b981'];

            for (let i = 0; i < numberOfPieces; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    rotation: Math.random() * 360,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 4 + 2,
                    oscillation: Math.random() * 2
                });
            }

            let animationFrame;
            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach((p) => {
                    p.y += p.speed;
                    p.rotation += 2;
                    p.x += Math.sin(p.oscillation);
                    p.oscillation += 0.05;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                pieces = pieces.filter(p => p.y < canvas.height);
                if (pieces.length > 0) {
                    animationFrame = requestAnimationFrame(update);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrame);
                }
            }
            update();
        }

        function triggerSuccessGlow() {
            const card = document.getElementById('mainContainer');
            card.style.transform = 'scale(1.02)';
            card.style.borderColor = '#10b981';
            card.style.boxShadow = '0 0 50px rgba(16, 185, 129, 0.5)';
            
            triggerConfetti();

            setTimeout(() => {
                card.style.transform = 'scale(1)';
                card.style.borderColor = 'var(--border)';
                card.style.boxShadow = '0 20px 50px rgba(0,0,0,0.5), 0 0 35px rgba(225, 48, 108, 0.15)';
            }, 1500);
        }

        async function startDownload() {
            const url = document.getElementById('videoUrl').value.trim();
            const format = document.getElementById('qualitySelect').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            const progressBarContainer = document.getElementById('progressBarContainer');
            const progressBar = document.getElementById('progressBar');

            if (!url) { alert(translations[currentLang]["msg_empty"]); return; }

            if (activeEventSource) activeEventSource.close();

            progressBarContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';

            const taskId = 'task_' + Date.now();

            activeEventSource = new EventSource(`/progress/${taskId}`);
            activeEventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.percent !== undefined) {
                    const pct = Math.round(data.percent);
                    progressBar.style.width = pct + '%';
                    
                    if (data.status === 'uploading') {
                        progressBar.innerText = 'Uploading to Cloud...';
                    } else {
                        progressBar.innerText = pct + '%';
                    }
                }
                if (data.status === 'completed' || data.status === 'error') {
                    activeEventSource.close();
                }
            };

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        url: url, 
                        format: format,
                        start_time: startTime,
                        end_time: endTime,
                        task_id: taskId
                    })
                });

                const data = await response.json();

                if (response.ok && data.download_url) {
                    progressBar.style.width = '100%';
                    progressBar.innerText = translations[currentLang]["msg_done"];
                    triggerSuccessGlow();
                    if (activeEventSource) activeEventSource.close();

                    window.location.href = data.download_url;
                } else {
                    alert(data.error || translations[currentLang]["msg_err"]);
                    progressBarContainer.style.display = 'none';
                    if (activeEventSource) activeEventSource.close();
                }
            } catch (error) {
                alert(translations[currentLang]["msg_server"]);
                progressBarContainer.style.display = 'none';
                if (activeEventSource) activeEventSource.close();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('app_lang') || 'en';
            changeLanguage(savedLang);

            const savedTheme = localStorage.getItem('app_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        });

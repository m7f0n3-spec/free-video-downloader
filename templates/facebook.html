<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1877f2;
            --primary-hover: #0d65d9;
            --primary-glow: rgba(24, 119, 242, 0.4);
            --bg: #0b0f19;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(24, 119, 242, 0.25), transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.15), transparent 50%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(24, 119, 242, 0.08) 0%, transparent 50%);
            animation: rotateBg 25s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        header {
            width: 100%;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        nav a svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        nav a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        nav a:hover svg {
            transform: translateY(-2px) scale(1.15);
        }

        nav a.active {
            color: #ffffff !important;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            font-weight: 800;
            box-shadow: 0 0 15px var(--primary-glow), 0 4px 12px rgba(24, 119, 242, 0.3);
        }

        nav a.active svg {
            fill: #ffffff !important;
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.8));
        }

        .lang-select {
            background: #1e293b;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            font-size: 0.85rem;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px 24px;
            border-radius: 24px;
            border: 1px solid var(--border);
            margin-top: 30px;
            width: 90%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 35px rgba(24, 119, 242, 0.2);
            animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        .container:hover {
            border-color: rgba(24, 119, 242, 0.4);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 45px rgba(24, 119, 242, 0.3);
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 15px;
            width: 100%;
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 18px var(--primary-glow);
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border: none;
            background: transparent;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            min-width: 0;
        }

        .btn-paste {
            padding: 10px 16px;
            background: rgba(24, 119, 242, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(24, 119, 242, 0.3);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-paste:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .trim-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #60a5fa;
            text-align: left;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        [dir="rtl"] .trim-title { text-align: right; }

        .trim-box {
            display: flex;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 14px;
            border: 1px dashed var(--border);
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .trim-box > div { flex: 1; min-width: 120px; }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.7);
            color: #fff;
            border-radius: 10px;
            outline: none;
            font-size: 0.9rem;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .trim-box label { font-size: 0.78rem; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600; }

        .options-group { display: flex; gap: 12px; margin-bottom: 20px; }

        select.quality-select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.7);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        button.btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1877f2, #0056b3);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 8px 25px -4px var(--primary-glow);
            position: relative;
            overflow: hidden;
        }

        button.btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -2px rgba(24, 119, 242, 0.6);
            background: linear-gradient(135deg, #1b82ff, #0d65d9);
        }

        .preview-card {
            display: none;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
            text-align: left;
            animation: fadeIn 0.5s ease forwards;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        [dir="rtl"] .preview-card { text-align: right; }

        .preview-card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
            object-fit: cover;
        }

        .preview-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; color: #fff; }
        .preview-meta { color: var(--text-muted); font-size: 0.82rem; }
        
        .playlist-badge {
            display: inline-block;
            background: #10b981;
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            overflow: hidden;
            border: 1px solid var(--border);
            padding: 3px;
        }

        .progress {
            width: 0%;
            height: 18px;
            background: linear-gradient(90deg, #1877f2, #10b981);
            border-radius: 6px;
            text-align: center;
            color: white;
            line-height: 18px;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(24, 119, 242, 0.5);
            transition: width 0.3s ease;
        }

        @media (max-width: 640px) {
            header {
                padding: 10px 3%;
                flex-direction: column;
                gap: 10px;
            }
            nav {
                width: 100%;
                justify-content: center;
                gap: 4px;
            }
            nav a {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            nav a span {
                display: inline-block;
            }
            .container {
                margin-top: 15px;
                padding: 20px 14px;
                width: 95%;
            }
            .trim-box { flex-direction: column; gap: 8px; }
        }

        .f2ter { text-align: center; margin-top: auto; padding: 20px 0; font-size: 0.8rem; color: var(--text-muted); }
        .fv { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="/" data-i18n="nav_home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </a>
            <a href="/youtube" data-i18n="nav_youtube">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                <span>YouTube</span>
            </a>
            <a href="/facebook" class="active" data-i18n="nav_facebook">
                <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                <span>Facebook</span>
            </a>
            <a href="/instagram" data-i18n="nav_instagram">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                <span>Instagram</span>
            </a>
            <a href="/tiktok" data-i18n="nav_tiktok">
                <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.28-2.42.53-4.9 2.19-6.68 1.54-1.66 3.75-2.6 6.01-2.58.01 1.41-.01 2.82.01 4.23-.97-.02-1.95.27-2.73.83-.87.61-1.41 1.58-1.5 2.63-.12 1.25.32 2.5 1.18 3.39.85.89 2.08 1.34 3.3 1.22 1.22-.08 2.33-.71 2.97-1.74.52-.81.72-1.78.71-2.74V.02z"/></svg>
                <span>TikTok</span>
            </a>
        </nav>
        <select id="language-select" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="ku">کوردی</option>
            <option value="ar">العربية</option>
        </select>
    </header>

    <div class="container" id="mainContainer">
        <h2 data-i18n="fb_title">Facebook Downloader</h2>
        
        <div class="input-group">
            <input type="text" id="videoUrl" data-i18n-ph="input_ph" placeholder="Paste video link here..." oninput="checkVideoInfo()">
            <button class="btn-paste" onclick="pasteFromClipboard()" data-i18n="btn_paste">Paste</button>
        </div>

        <!-- بەشی بڕینی ڤیدیۆ / Trim Video -->
        <div class="trim-title" data-i18n="trim_heading"> Trim Video (Optional)</div>
        <div class="trim-box">
            <div>
                <label data-i18n="lbl_start">Start Time (Sec)</label>
                <input type="number" id="startTime" placeholder="0" min="0">
            </div>
            <div>
                <label data-i18n="lbl_end">End Time (Sec)</label>
                <input type="number" id="endTime" placeholder="End" min="0">
            </div>
        </div>

        <div class="options-group">
            <select id="qualitySelect" class="quality-select">
                <option value="best" data-i18n="opt_best">Best Quality (Auto)</option>
                <option value="mp3" data-i18n="opt_mp3">Audio Only (MP3)</option>
            </select>
        </div>

        <button class="btn-main" onclick="startDownload()" data-i18n="btn_dl">Download</button>

        <div class="preview-card" id="previewCard">
            <img id="prevImg" src="" alt="Thumbnail">
            <div class="preview-title" id="prevTitle"></div>
            <div class="preview-meta" id="prevMeta"></div>
            <div id="playlistBadge" class="playlist-badge" style="display: none;"></div>
        </div>

        <div class="progress-bar" id="progressBarContainer">
            <div class="progress" id="progressBar">0%</div>
        </div>
    </div>
    
    <script>
        const translations = {
            en: {
                "nav_home": "Home",
                "nav_youtube": "YouTube",
                "nav_facebook": "Facebook",
                "nav_instagram": "Instagram",
                "nav_tiktok": "TikTok",
                "fb_title": "Facebook Downloader",
                "input_ph": "Paste video link here...",
                "btn_paste": "Paste",
                "trim_heading": "✂️ Trim Video (Optional)",
                "opt_best": "Best Quality (Auto)",
                "opt_mp3": "Audio Only (MP3)",
                "btn_dl": "Download",
                "lbl_start": "Start Time (Sec)",
                "lbl_end": "End Time (Sec)",
                "msg_empty": "Please enter a URL!",
                "msg_fetching": "Fetching video info...",
                "msg_dl": "Downloading...",
                "msg_done": "Completed!",
                "msg_err": "Error occurred during download.",
                "msg_server": "Server Connection Error!",
                "playlist_info": "Playlist Detected ({count} Videos) - Will Download as ZIP"
            },
            ku: {
                "nav_home": "سەرەکی",
                "nav_youtube": "یووتیووب",
                "nav_facebook": "فەیسبووک",
                "nav_instagram": "ئینستاگرام",
                "nav_tiktok": "تیکتۆک",
                "fb_title": "داگرتنی ڤیدیۆی فەیسبووک",
                "input_ph": "لینکی ڤیدیۆکە لێرە دابنێ...",
                "btn_paste": "پەیست",
                "trim_heading": " بڕینی ڤیدیۆ (ئارەزوومەندانە)",
                "opt_best": "باشترین کوالێتی (ئۆتۆ)",
                "opt_mp3": "تەنها دەنگ (MP3)",
                "btn_dl": "داونلۆدکردن",
                "lbl_start": "کاتی دەستپێک (چرکە)",
                "lbl_end": "کاتی کۆتایی (چرکە)",
                "msg_empty": "تکایە لینکێک دابنێ!",
                "msg_fetching": "هێنانی زانیاری ڤیدیۆ...",
                "msg_dl": "داگرتن...",
                "msg_done": "تەواوبوو!",
                "msg_err": "هەڵەیەک ڕوویدا لە کاتی داگرتن.",
                "msg_server": "کێشەی پەیوەندیکردن بە سێرڤەر!",
                "playlist_info": "کۆمەڵە ڤیدیۆ دیاریکرا ({count} ڤیدیۆ) - بە فایلی ZIP دادەبەزێت"
            },
            ar: {
                "nav_home": "الرئيسية",
                "nav_youtube": "يوتيوب",
                "nav_facebook": "فيسبوك",
                "nav_instagram": "إنستغرام",
                "nav_tiktok": "تيك توك",
                "fb_title": "تحميل فيديوهات فيسبوك",
                "input_ph": "ألصق رابط الفيديو هنا...",
                "btn_paste": "لصق",
                "trim_heading": "✂️ قص الفيديو (اختياري)",
                "opt_best": "أفضل جودة (تلقائي)",
                "opt_mp3": "صوت فقط (MP3)",
                "btn_dl": "تحميل",
                "lbl_start": "وقت البداية (ثانية)",
                "lbl_end": "وقت النهاية (ثانية)",
                "msg_empty": "الرجاء إدخال الرابط!",
                "msg_fetching": "جلب معلومات الفيديو...",
                "msg_dl": "جاري التحميل...",
                "msg_done": "اكتمل!",
                "msg_err": "حدث خطأ أثناء التحميل.",
                "msg_server": "خطأ في الاتصال بالسيرفر!",
                "playlist_info": "تم التعرّف على قائمة تشغيل ({count} فيديو) - سيتم التحميل بصيغة ZIP"
            }
        };

        let currentLang = 'en';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    const span = elem.querySelector('span');
                    if (span) {
                        span.innerText = translations[lang][key];
                    } else {
                        elem.innerText = translations[lang][key];
                    }
                }
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(elem => {
                const key = elem.getAttribute('data-i18n-ph');
                if (translations[lang] && translations[lang][key]) elem.placeholder = translations[lang][key];
            });

            const selectElem = document.getElementById('language-select');
            if (selectElem) selectElem.value = lang;
        }

        async function pasteFromClipboard() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    document.getElementById('videoUrl').value = text;
                    checkVideoInfo();
                } else {
                    throw new Error("Clipboard API not supported");
                }
            } catch (err) {
                const input = document.getElementById('videoUrl');
                input.focus();
                input.select();
                alert('Please paste the link using Ctrl+V (or Command+V).');
            }
        }

        let typingTimer;
        function checkVideoInfo() {
            clearTimeout(typingTimer);
            const url = document.getElementById('videoUrl').value;
            if (url.length > 10) {
                typingTimer = setTimeout(() => fetchMetadata(url), 600);
            }
        }

        async function fetchMetadata(url) {
            const previewCard = document.getElementById('previewCard');
            const qualitySelect = document.getElementById('qualitySelect');
            const playlistBadge = document.getElementById('playlistBadge');

            try {
                const response = await fetch('/get-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('prevImg').src = data.thumbnail;
                    document.getElementById('prevTitle').innerText = data.title;
                    document.getElementById('prevMeta').innerText = `Duration: ${data.duration} | By: ${data.uploader}`;
                    
                    if (data.is_playlist) {
                        const badgeText = translations[currentLang]["playlist_info"].replace('{count}', data.playlist_count);
                        playlistBadge.innerText = badgeText;
                        playlistBadge.style.display = 'inline-block';
                    } else {
                        playlistBadge.style.display = 'none';
                    }

                    qualitySelect.innerHTML = `<option value="best">${translations[currentLang]["opt_best"]}</option>`;
                    if (data.qualities && data.qualities.length > 0) {
                        data.qualities.forEach(q => {
                            const opt = document.createElement('option');
                            opt.value = q.format_id;
                            opt.innerText = q.label;
                            qualitySelect.appendChild(opt);
                        });
                    }
                    qualitySelect.innerHTML += `<option value="mp3">${translations[currentLang]["opt_mp3"]}</option>`;

                    previewCard.style.display = 'block';
                }
            } catch (e) {
                previewCard.style.display = 'none';
            }
        }

        function triggerSuccessGlow() {
            const card = document.getElementById('mainContainer');
            card.style.transform = 'scale(1.02)';
            card.style.borderColor = '#10b981';
            card.style.boxShadow = '0 0 50px rgba(16, 185, 129, 0.4)';
            
            setTimeout(() => {
                card.style.transform = 'scale(1)';
                card.style.borderColor = 'var(--border)';
                card.style.boxShadow = '0 20px 50px rgba(0,0,0,0.5), 0 0 35px rgba(24, 119, 242, 0.2)';
            }, 1500);
        }

        async function startDownload() {
            const url = document.getElementById('videoUrl').value;
            const format = document.getElementById('qualitySelect').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            const progressBarContainer = document.getElementById('progressBarContainer');
            const progressBar = document.getElementById('progressBar');

            if (!url) { alert(translations[currentLang]["msg_empty"]); return; }

            progressBarContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';

            const taskId = 'task_' + Date.now();

            const eventSource = new EventSource(`/progress/${taskId}`);
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.percent !== undefined) {
                    const pct = Math.round(data.percent);
                    progressBar.style.width = pct + '%';
                    
                    if (data.status === 'uploading') {
                        progressBar.innerText = 'Uploading to Cloud...';
                    } else {
                        progressBar.innerText = pct + '%';
                    }
                }
                if (data.status === 'completed' || data.status === 'error') {
                    eventSource.close();
                }
            };

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        url: url, 
                        format: format,
                        start_time: startTime,
                        end_time: endTime,
                        task_id: taskId
                    })
                });

                const data = await response.json();

                if (response.ok && data.download_url) {
                    progressBar.style.width = '100%';
                    progressBar.innerText = translations[currentLang]["msg_done"];
                    triggerSuccessGlow();
                    eventSource.close();

                    window.location.href = data.download_url;
                } else {
                    alert(data.error || translations[currentLang]["msg_err"]);
                    progressBarContainer.style.display = 'none';
                    eventSource.close();
                }
            } catch (error) {
                alert(translations[currentLang]["msg_server"]);
                progressBarContainer.style.display = 'none';
                eventSource.close();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('app_lang') || 'en';
            changeLanguage(savedLang);
        });
    </script>

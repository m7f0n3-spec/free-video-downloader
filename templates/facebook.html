<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15), transparent 50%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        nav { display: flex; gap: 10px; flex-wrap: wrap; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 10px;
        }
        nav a:hover, nav a.active { color: #fff; background: rgba(255, 255, 255, 0.08); }

        .lang-select {
            background: #1e293b;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-top: 40px;
            width: 90%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin: 15px 0 15px 0;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            border-radius: 12px;
            outline: none;
            font-size: 1rem;
        }
        input[type="text"]:focus, input[type="number"]:focus { border-color: var(--primary); }

        .btn-paste {
            padding: 0 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-paste:hover { background: rgba(255, 255, 255, 0.2); }

        .trim-box {
            display: flex !important;
            gap: 12px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            padding: 12px !important;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            border: 1px dashed var(--border);
        }

        .trim-box > div {
            flex: 1 1 0% !important;
            min-width: 0 !important;
        }
        .trim-box input {
            width: 100% !important;
            box-sizing: border-box !important;
        }
        .trim-box label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 5px; font-weight: 600; }

        .options-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        select.quality-select {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-weight: 600;
        }

        button.btn-main {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
        }
        button.btn-main:hover { background-color: var(--primary-hover); }

        .preview-card {
            display: none;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }
        [dir="rtl"] .preview-card { text-align: right; }

        .preview-card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .preview-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 5px; }
        .preview-meta { color: var(--text-muted); font-size: 0.85rem; }
        .playlist-badge {
            display: inline-block;
            background: #10b981;
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .progress-bar {
            width: 100%;
            background-color: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .progress {
            width: 0%;
            height: 22px;
            background-color: #10b981;
            text-align: center;
            color: white;
            line-height: 22px;
            font-size: 12px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            header {
                padding: 12px 4%;
                flex-direction: column;
                gap: 12px;
            }
            nav {
                justify-content: center;
                gap: 5px;
            }
            nav a {
                padding: 6px 10px;
                font-size: 0.85rem;
            }
            .container {
                margin-top: 20px;
                padding: 20px 15px;
                width: 95%;
            }
            .trim-box {
                flex-direction: column;
                gap: 8px;
            }
        }
        .f2ter {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .fv {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="/" data-i18n="nav_home">Home</a>
            <a href="/youtube" data-i18n="nav_youtube">YouTube</a>
            <a href="/facebook" class="active" data-i18n="nav_facebook">Facebook</a>
            <a href="/instagram" data-i18n="nav_instagram">Instagram</a>
            <a href="/tiktok" data-i18n="nav_tiktok">TikTok</a>
        </nav>
        <select id="language-select" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="ku">کوردی</option>
            <option value="ar">العربية</option>
        </select>
    </header>

    <div class="container">
        <h2 data-i18n="fb_title">Facebook Downloader</h2>
        
        <div class="input-group">
            <input type="text" id="videoUrl" data-i18n-ph="input_ph" placeholder="Paste video link here..." oninput="checkVideoInfo()">
            <button class="btn-paste" onclick="pasteFromClipboard()" data-i18n="btn_paste">Paste</button>
        </div>

        <div class="trim-box">
            <div>
                <label data-i18n="lbl_start">Start Time (Sec)</label>
                <input type="number" id="startTime" placeholder="0" min="0">
            </div>
            <div>
                <label data-i18n="lbl_end">End Time (Sec)</label>
                <input type="number" id="endTime" placeholder="End" min="0">
            </div>
        </div>

        <div class="options-group">
            <select id="qualitySelect" class="quality-select">
                <option value="best" data-i18n="opt_best">Best Quality (Auto)</option>
                <option value="mp3" data-i18n="opt_mp3">Audio Only (MP3)</option>
            </select>
        </div>

        <button class="btn-main" onclick="startDownload()" data-i18n="btn_dl">Download</button>

        <div class="preview-card" id="previewCard">
            <img id="prevImg" src="" alt="Thumbnail">
            <div class="preview-title" id="prevTitle"></div>
            <div class="preview-meta" id="prevMeta"></div>
            <div id="playlistBadge" class="playlist-badge" style="display: none;"></div>
        </div>

        <div class="progress-bar" id="progressBarContainer">
            <div class="progress" id="progressBar">0%</div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                "nav_home": "Home",
                "nav_youtube": "YouTube",
                "nav_facebook": "Facebook",
                "nav_instagram": "Instagram",
                "nav_tiktok": "TikTok",
                "fb_title": "Facebook Downloader",
                "input_ph": "Paste video link here...",
                "btn_paste": "Paste",
                "opt_best": "Best Quality (Auto)",
                "opt_mp3": "Audio Only (MP3)",
                "btn_dl": "Download",
                "lbl_start": "Start Time (Sec)",
                "lbl_end": "End Time (Sec)",
                "msg_empty": "Please enter a URL!",
                "msg_fetching": "Fetching video info...",
                "msg_dl": "Downloading...",
                "msg_done": "Completed!",
                "msg_err": "Error occurred during download.",
                "msg_server": "Server Connection Error!",
                "playlist_info": "Playlist Detected ({count} Videos) - Will Download as ZIP"
            },
            ku: {
                "nav_home": "سەرەکی",
                "nav_youtube": "یووتیووب",
                "nav_facebook": "فەیسبووک",
                "nav_instagram": "ئینستاگرام",
                "nav_tiktok": "تیکتۆک",
                "fb_title": "داگرتنی ڤیدیۆی فەیسبووک",
                "input_ph": "لینکی ڤیدیۆکە لێرە دابنێ...",
                "btn_paste": "پەیست",
                "opt_best": "باشترین کوالێتی (ئۆتۆ)",
                "opt_mp3": "تەنها دەنگ (MP3)",
                "btn_dl": "داونلۆدکردن",
                "lbl_start": "کاتی دەستپێک (چرکە)",
                "lbl_end": "کاتی کۆتایی (چرکە)",
                "msg_empty": "تکایە لینکێک دابنێ!",
                "msg_fetching": "هێنانی زانیاری ڤیدیۆ...",
                "msg_dl": "داگرتن...",
                "msg_done": "تەواوبوو!",
                "msg_err": "هەڵەیەک ڕوویدا لە کاتی داگرتن.",
                "msg_server": "کێشەی پەیوەندیکردن بە سێرڤەر!",
                "playlist_info": "کۆمەڵە ڤیدیۆ دیاریکرا ({count} ڤیدیۆ) - بە فایلی ZIP دادەبەزێت"
            },
            ar: {
                "nav_home": "الرئيسية",
                "nav_youtube": "يوتيوب",
                "nav_facebook": "فيسبوك",
                "nav_instagram": "إنستغرام",
                "nav_tiktok": "تيك توك",
                "fb_title": "تحميل فيديوهات فيسبوك",
                "input_ph": "ألصق رابط الفيديو هنا...",
                "btn_paste": "لصق",
                "opt_best": "أفضل جودة (تلقائي)",
                "opt_mp3": "صوت فقط (MP3)",
                "btn_dl": "تحميل",
                "lbl_start": "وقت البداية (ثانية)",
                "lbl_end": "وقت النهاية (ثانية)",
                "msg_empty": "الرجاء إدخال الرابط!",
                "msg_fetching": "جلب معلومات الفيديو...",
                "msg_dl": "جاري التحميل...",
                "msg_done": "اكتمل!",
                "msg_err": "حدث خطأ أثناء التحميل.",
                "msg_server": "خطأ في الاتصال بالسيرفر!",
                "playlist_info": "تم التعرّف على قائمة تشغيل ({count} فيديو) - سيتم التحميل بصيغة ZIP"
            }
        };

        let currentLang = 'en';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) elem.innerText = translations[lang][key];
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(elem => {
                const key = elem.getAttribute('data-i18n-ph');
                if (translations[lang] && translations[lang][key]) elem.placeholder = translations[lang][key];
            });

            const selectElem = document.getElementById('language-select');
            if (selectElem) selectElem.value = lang;
        }

        async function pasteFromClipboard() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    document.getElementById('videoUrl').value = text;
                    checkVideoInfo();
                } else {
                    throw new Error("Clipboard API not supported");
                }
            } catch (err) {
                const input = document.getElementById('videoUrl');
                input.focus();
                input.select();
                alert('Please paste the link using Ctrl+V (or Command+V).');
            }
        }

        let typingTimer;
        function checkVideoInfo() {
            clearTimeout(typingTimer);
            const url = document.getElementById('videoUrl').value;
            if (url.length > 10) {
                typingTimer = setTimeout(() => fetchMetadata(url), 600);
            }
        }

        async function fetchMetadata(url) {
            const previewCard = document.getElementById('previewCard');
            const qualitySelect = document.getElementById('qualitySelect');
            const playlistBadge = document.getElementById('playlistBadge');

            try {
                const response = await fetch('/get-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('prevImg').src = data.thumbnail;
                    document.getElementById('prevTitle').innerText = data.title;
                    document.getElementById('prevMeta').innerText = `Duration: ${data.duration} | By: ${data.uploader}`;
                    
                    if (data.is_playlist) {
                        const badgeText = translations[currentLang]["playlist_info"].replace('{count}', data.playlist_count);
                        playlistBadge.innerText = badgeText;
                        playlistBadge.style.display = 'inline-block';
                    } else {
                        playlistBadge.style.display = 'none';
                    }

                    qualitySelect.innerHTML = `<option value="best">${translations[currentLang]["opt_best"]}</option>`;
                    if (data.qualities && data.qualities.length > 0) {
                        data.qualities.forEach(q => {
                            const opt = document.createElement('option');
                            opt.value = q.format_id;
                            opt.innerText = q.label;
                            qualitySelect.appendChild(opt);
                        });
                    }
                    qualitySelect.innerHTML += `<option value="mp3">${translations[currentLang]["opt_mp3"]}</option>`;

                    previewCard.style.display = 'block';
                }
            } catch (e) {
                previewCard.style.display = 'none';
            }
        }

        async function startDownload() {
            const url = document.getElementById('videoUrl').value;
            const format = document.getElementById('qualitySelect').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            const progressBarContainer = document.getElementById('progressBarContainer');
            const progressBar = document.getElementById('progressBar');

            if (!url) { alert(translations[currentLang]["msg_empty"]); return; }

            progressBarContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';

            const taskId = 'task_' + Date.now();

            const eventSource = new EventSource(`/progress/${taskId}`);
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.percent !== undefined) {
                    const pct = Math.round(data.percent);
                    progressBar.style.width = pct + '%';
                    
                    if (data.status === 'uploading') {
                        progressBar.innerText = 'Uploading to Cloud...';
                    } else {
                        progressBar.innerText = pct + '%';
                    }
                }
                if (data.status === 'completed' || data.status === 'error') {
                    eventSource.close();
                }
            };

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        url: url, 
                        format: format,
                        start_time: startTime,
                        end_time: endTime,
                        task_id: taskId
                    })
                });

                const data = await response.json();

                if (response.ok && data.download_url) {
                    progressBar.style.width = '100%';
                    progressBar.innerText = translations[currentLang]["msg_done"];
                    eventSource.close();

                    window.location.href = data.download_url;
                } else {
                    alert(data.error || translations[currentLang]["msg_err"]);
                    progressBarContainer.style.display = 'none';
                    eventSource.close();
                }
            } catch (error) {
                alert(translations[currentLang]["msg_server"]);
                progressBarContainer.style.display = 'none';
                eventSource.close();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('app_lang') || 'en';
            changeLanguage(savedLang);
        });
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <footer class="f2ter">

    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- بەکارهێنانی کتێبخانەی Canvas-Confetti بۆ کاریگەری بارینی ئاگرین/پێپەر -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #1877f2;
            --primary-hover: #0d65d9;
            --primary-glow: rgba(24, 119, 242, 0.4);
            --bg: #070a12;
            --bg-gradient: linear-gradient(-45deg, #070a12, #0d1b2a, #1877f2, #002244, #1877f2);
            /* Glassmorphism Variables */
            --card-bg: rgba(15, 23, 42, 0.55);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --header-bg: rgba(11, 15, 25, 0.45);
            --input-bg: rgba(11, 15, 25, 0.5);
            --heading-gradient: linear-gradient(135deg, #ffffff 30%, #60a5fa);
        }

        /* Light Theme Variables */
        [data-theme="light"] {
            --bg: #f0f2f5;
            --bg-gradient: linear-gradient(-45deg, #e4e6eb, #f0f2f5, #e7f3ff, #ffffff);
            --card-bg: rgba(255, 255, 255, 0.75);
            --border: rgba(0, 0, 0, 0.1);
            --text: #050505;
            --text-muted: #65676b;
            --header-bg: rgba(255, 255, 255, 0.65);
            --input-bg: rgba(240, 242, 245, 0.8);
            --heading-gradient: linear-gradient(135deg, #1877f2 30%, #0d65d9);
        }

        /* لێرە transition لەسەر * لادراوە بۆ ئەوەی ڕێگە لە ئەنیمەیشنی background نەگرێت */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Animated Gradient Background - تایبەت بە ڕەنگەکانی فەیسبووک */
        body {
            background: var(--bg-gradient);
            background-size: 400% 400% !important;
            animation: gradientBG 10s ease infinite !important;
            color: var(--text);
            font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            transition: none !important; 
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Glassmorphic Header */
        header {
            width: 100%;
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Theme Toggle Button */
        .theme-toggle-btn {
            background: rgba(30, 41, 59, 0.5);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.8);
        }

        .theme-toggle-btn:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .theme-toggle-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        nav a svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        nav a:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.15);
        }

        [data-theme="light"] nav a:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        nav a:hover svg {
            transform: translateY(-2px) scale(1.15);
        }

        nav a.active {
            color: #ffffff !important;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            font-weight: 800;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        nav a.active svg {
            fill: #ffffff !important;
            filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.8));
        }

        .lang-select {
            background: rgba(30, 41, 59, 0.5);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] .lang-select {
            background: rgba(255, 255, 255, 0.8);
        }

        /* Glassmorphic Main Container */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 35px 28px;
            border-radius: 28px;
            border: 1px solid var(--border);
            margin-top: 40px;
            width: 90%;
            max-width: 560px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3), 0 0 40px rgba(24, 119, 242, 0.15);
            animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .container:hover {
            border-color: rgba(24, 119, 242, 0.4);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4), 0 0 50px rgba(24, 119, 242, 0.25);
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container h2 {
            font-size: 2rem;
            font-weight: 800;
            background: var(--heading-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px;
            margin-bottom: 18px;
            width: 100%;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border: none;
            background: transparent;
            color: var(--text);
            outline: none;
            font-size: 0.95rem;
            min-width: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-paste {
            padding: 10px 18px;
            background: rgba(24, 119, 242, 0.15);
            color: var(--primary);
            border: 1px solid rgba(24, 119, 242, 0.3);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-paste:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 18px var(--primary-glow);
        }

        .trim-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            text-align: left;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        [dir="rtl"] .trim-title { text-align: right; }

        .trim-box {
            display: flex;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            background: var(--input-bg);
            border-radius: 16px;
            border: 1px dashed var(--border);
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .trim-box > div { flex: 1; min-width: 120px; }

        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            border-radius: 10px;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .trim-box label { font-size: 0.78rem; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600; }

        .options-group { display: flex; gap: 12px; margin-bottom: 22px; }

        select.quality-select {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 14px;
            outline: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button.btn-main {
            position: relative;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1877f2, #0056b3);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            overflow: hidden;
            z-index: 1;
            box-shadow: 0 8px 25px -4px var(--primary-glow);
            transition: all 0.3s ease;
        }

        button.btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -2px rgba(24, 119, 242, 0.7);
            filter: brightness(1.1);
        }

        button.btn-main.loading {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 25px -4px rgba(16, 185, 129, 0.5);
        }

        /* --- Skeleton Loader --- */
        .skeleton {
            display: none;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-top: 20px;
        }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.03) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 10px;
        }

        .skeleton-img {
            width: 100%;
            height: 180px;
            margin-bottom: 12px;
        }

        .skeleton-text {
            height: 16px;
            margin-bottom: 8px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .preview-card {
            display: none;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            margin-top: 20px;
            text-align: left;
            animation: fadeIn 0.5s ease forwards;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        [dir="rtl"] .preview-card { text-align: right; }

        .preview-card img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 12px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .preview-title { font-weight: 700; font-size: 0.98rem; margin-bottom: 6px; color: var(--text); }
        .preview-meta { color: var(--text-muted); font-size: 0.84rem; }
        
        .playlist-badge {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .progress-bar {
            width: 100%;
            background-color: var(--input-bg);
            border-radius: 14px;
            margin-top: 20px;
            display: none;
            overflow: hidden;
            border: 1px solid var(--border);
            padding: 4px;
        }

        .progress {
            width: 0%;
            height: 20px;
            background: linear-gradient(90deg, #1877f2, #10b981);
            background-size: 200% 100%;
            animation: moveGradient 2s linear infinite;
            border-radius: 8px;
            text-align: center;
            color: white;
            line-height: 20px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(24, 119, 242, 0.5);
            transition: width 0.3s ease;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 640px) {
            header {
                padding: 12px 4%;
                flex-direction: column;
                gap: 12px;
            }
            nav {
                width: 100%;
                justify-content: center;
                gap: 6px;
            }
            nav a {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            .container {
                margin-top: 20px;
                padding: 24px 16px;
                width: 95%;
            }
            .trim-box { flex-direction: column; gap: 10px; }
        }

        .f2ter { text-align: center; margin-top: auto; padding: 25px 0; font-size: 0.82rem; color: var(--text-muted); }
        .fv { color: var(--primary); text-decoration: none; font-weight: 600; }
        .fv:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="/" data-i18n="nav_home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>

            </a>

                <span>Instagram</span>

            <a href="/tiktok" data-i18n="nav_tiktok">

                <span>TikTok</span>
            </a>
        </nav>
        
        <div class="header-controls">
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode" id="themeBtn">
                <!-- Sun Icon -->
                <svg id="sunIcon" style="display: none;" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>

            </button>
            <select id="language-select" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="ku">کوردی</option>
                <option value="ar">العربية</option>
            </select>
        </div>
    </header>

    <div class="container" id="mainContainer">
        <h2 data-i18n="fb_title">Facebook Downloader</h2>
        
        <div class="input-group">
            <input type="text" id="videoUrl" data-i18n-ph="input_ph" placeholder="Paste video link here..." oninput="checkVideoInfo()">
            <button class="btn-paste" onclick="pasteFromClipboard()" data-i18n="btn_paste">Paste</button>
        </div>

        <div class="trim-title" data-i18n="trim_heading">✂️ Trim Video (Optional)</div>
        <div class="trim-box">
            <div>
                <label data-i18n="lbl_start">Start Time (Sec)</label>
                <input type="number" id="startTime" placeholder="0" min="0">
            </div>
            <div>
                <label data-i18n="lbl_end">End Time (Sec)</label>
                <input type="number" id="endTime" placeholder="End" min="0">
            </div>
        </div>

        <div class="options-group">
            <select id="qualitySelect" class="quality-select">
                <option value="best" data-i18n="opt_best">Best Quality (Auto)</option>

            <div class="shimmer skeleton-text"></div>
            <div class="shimmer skeleton-text" style="width: 60%;"></div>
        </div>

        <div class="preview-card" id="previewCard">
            <img id="prevImg" src="" alt="Thumbnail">
            <div class="preview-title" id="prevTitle"></div>
            <div class="preview-meta" id="prevMeta"></div>
            <div id="playlistBadge" class="playlist-badge" style="display: none;"></div>
        </div>

        <div class="progress-bar" id="progressBarContainer">
            <div class="progress" id="progressBar">0%</div>
        </div>
    </div>

                "fb_title": "تحميل فيديوهات فيسبوك",
                "input_ph": "ألصق رابط الفيديو هنا...",
                "btn_paste": "لصق",
                "trim_heading": "✂️ قص الفيديو (اختياري)",
                "opt_best": "أفضل جودة (تلقائي)",
                "opt_mp3": "صوت فقط (MP3)",
                "btn_dl": "تحميل",
                "lbl_start": "وقت البداية (ثانية)",
                "lbl_end": "وقت النهاية (ثانية)",
                "msg_empty": "الرجاء إدخال الرابط!",
                "msg_fetching": "جلب معلومات الفيديو...",
                "msg_dl": "جاري المعالجة...",
                "msg_done": "اكتمل!",
                "msg_err": "حدث خطأ أثناء التحميل.",
                "msg_server": "خطأ في الاتصال بالسيرفر!",
                "playlist_info": "تم التعرّف على قائمة تشغيل ({count} فيديو) - سيتم التحميل بصيغة ZIP",
                "prompt_paste": "الرجاء لصق رابط الفيديو هنا:"
            }
        };

        let currentLang = 'en';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    const span = elem.querySelector('span');
                    if (span) {
                        span.innerText = translations[lang][key];
                    } else {
                        elem.innerText = translations[lang][key];
                    }
                }
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(elem => {
                const key = elem.getAttribute('data-i18n-ph');
                if (translations[lang] && translations[lang][key]) elem.placeholder = translations[lang][key];
            });

            const selectElem = document.getElementById('language-select');
            if (selectElem) selectElem.value = lang;
        }

        /* --- Theme Toggle Functionality --- */
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(newTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('app_theme', theme);
            
            const sunIcon = document.getElementById('sunIcon');
            const moonIcon = document.getElementById('moonIcon');

            if (theme === 'light') {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            } else {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
        }

        async function pasteFromClipboard() {
            const inputField = document.getElementById('videoUrl');

            if (navigator.clipboard && navigator.clipboard.readText) {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        inputField.value = text;
                        checkVideoInfo();
                        return;
                    }
                } catch (err) {
                    console.warn("Clipboard API failed or blocked, trying fallbacks...");
                }
            }

            try {
                inputField.focus();
                inputField.select();
                const successful = document.execCommand('paste');
                if (successful && inputField.value) {
                    checkVideoInfo();
                    return;
                }
            } catch (err) {
                console.warn("execCommand failed...");
            }

            const promptMsg = translations[currentLang]["prompt_paste"] || "Please paste the link here:";
            const manualText = prompt(promptMsg);
            if (manualText) {
                inputField.value = manualText.trim();
                checkVideoInfo();
            }
        }

        let typingTimer;
        function checkVideoInfo() {
            clearTimeout(typingTimer);
            const url = document.getElementById('videoUrl').value;
            if (url.length > 10) {
                typingTimer = setTimeout(() => fetchMetadata(url), 600);
            }
        }

        async function fetchMetadata(url) {
            const previewCard = document.getElementById('previewCard');
            const skeleton = document.getElementById('skeletonLoader');
            const qualitySelect = document.getElementById('qualitySelect');
            const playlistBadge = document.getElementById('playlistBadge');

            previewCard.style.display = 'none';
            skeleton.style.display = 'block';

            try {
                const response = await fetch('/get-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('prevImg').src = data.thumbnail;
                    document.getElementById('prevTitle').innerText = data.title;
                    document.getElementById('prevMeta').innerText = `Duration: ${data.duration} | By: ${data.uploader}`;
                    
                    if (data.is_playlist) {
                        const badgeText = translations[currentLang]["playlist_info"].replace('{count}', data.playlist_count);
                        playlistBadge.innerText = badgeText;
                        playlistBadge.style.display = 'inline-block';
                    } else {
                        playlistBadge.style.display = 'none';
                    }

                    qualitySelect.innerHTML = `<option value="best">${translations[currentLang]["opt_best"]}</option>`;
                    if (data.qualities && data.qualities.length > 0) {
                        data.qualities.forEach(q => {
                            const opt = document.createElement('option');
                            opt.value = q.format_id;
                            opt.innerText = q.label;
                            qualitySelect.appendChild(opt);
                        });
                    }
                    qualitySelect.innerHTML += `<option value="mp3">${translations[currentLang]["opt_mp3"]}</option>`;

                    skeleton.style.display = 'none';
                    previewCard.style.display = 'block';
                } else {
                    skeleton.style.display = 'none';
                }
            } catch (e) {
                skeleton.style.display = 'none';
                previewCard.style.display = 'none';
            }
        }

        function triggerSuccessGlow() {
            const card = document.getElementById('mainContainer');
            card.style.transform = 'scale(1.02)';
            card.style.borderColor = '#10b981';
            card.style.boxShadow = '0 0 50px rgba(16, 185, 129, 0.5)';

            // Confetti Animation Effect
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            setTimeout(() => {
                card.style.transform = 'scale(1)';
                card.style.borderColor = 'var(--border)';
                card.style.boxShadow = '0 25px 60px rgba(0, 0, 0, 0.3), 0 0 40px rgba(24, 119, 242, 0.15)';
            }, 1500);
        }

        async function startDownload() {
            const url = document.getElementById('videoUrl').value;
            const format = document.getElementById('qualitySelect').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const btnMain = document.querySelector('.btn-main');

            const progressBarContainer = document.getElementById('progressBarContainer');
            const progressBar = document.getElementById('progressBar');

            if (!url) { alert(translations[currentLang]["msg_empty"]); return; }

            btnMain.classList.add('loading');
            btnMain.innerText = translations[currentLang]["msg_dl"] || "Processing...";

            progressBarContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';

            const taskId = 'task_' + Date.now();

            const eventSource = new EventSource(`/progress/${taskId}`);
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.percent !== undefined) {
                    const pct = Math.round(data.percent);
                    progressBar.style.width = pct + '%';
                    
                    if (data.status === 'uploading') {
                        progressBar.innerText = 'Uploading to Cloud...';
                    } else {
                        progressBar.innerText = pct + '%';
                    }
                }
                if (data.status === 'completed' || data.status === 'error') {
                    eventSource.close();
                }
            };

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        url: url, 
                        format: format,
                        start_time: startTime,
                        end_time: endTime,
                        task_id: taskId
                    })
                });

                const data = await response.json();

                if (response.ok && data.download_url) {
                    progressBar.style.width = '100%';
                    progressBar.innerText = translations[currentLang]["msg_done"];
                    btnMain.innerText = translations[currentLang]["msg_done"] || "Completed!";
                    triggerSuccessGlow();
                    eventSource.close();

                    setTimeout(() => {
                        btnMain.classList.remove('loading');
                        btnMain.innerText = translations[currentLang]["btn_dl"];
                    }, 2000);

                    window.location.href = data.download_url;
                } else {
                    alert(data.error || translations[currentLang]["msg_err"]);
                    btnMain.classList.remove('loading');
                    btnMain.innerText = translations[currentLang]["btn_dl"];
                    progressBarContainer.style.display = 'none';
                    eventSource.close();
                }
            } catch (error) {
                alert(translations[currentLang]["msg_server"]);
                btnMain.classList.remove('loading');
                btnMain.innerText = translations[currentLang]["btn_dl"];
                progressBarContainer.style.display = 'none';
                eventSource.close();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('app_lang') || 'en';
            changeLanguage(savedLang);

            const savedTheme = localStorage.getItem('app_theme') || 'dark';
            applyTheme(savedTheme);
        });
    </script>
